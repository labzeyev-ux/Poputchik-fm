name: Build issue
on:
  push:
    paths:
      - "issues/*/script.txt"
  workflow_dispatch:
    inputs:
      issue:
        description: "Папка выпуска, например issues/2026-11-15"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pick issue
        id: pick
        run: |
          I="${{ inputs.issue }}"
          if [ -z "$I" ]; then
            I="$(git diff --name-only HEAD~1 HEAD | grep -E '^issues/[^/]+/script\.txt$' | head -1 | xargs -r dirname)"
          fi
          [ -n "$I" ] || { echo "нет папки выпуска"; exit 1; }
          echo "issue=$I" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install numpy requests pillow faster-whisper
      - name: Speech cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(basename "${{ steps.pick.outputs.issue }}")"
          mkdir -p cache
          for T in "$BASE" "$BASE-test"; do
            gh release download "$T" -p speech.wav -p speech.json -D cache --clobber 2>/dev/null && break || true
          done
          if grep -q '"reuse_audio": true' "${{ steps.pick.outputs.issue }}/meta.json" && [ ! -f cache/speech.wav ]; then
            gh release download "$BASE" -p audio.wav -O cache/legacy_audio.wav 2>/dev/null || true
          fi
          ls -la cache
      - name: Make issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/make_issue.py "${{ steps.pick.outputs.issue }}" out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(basename "${{ steps.pick.outputs.issue }}")"
          # сборка не из main — тестовая, отдельный тег, основной выпуск не трогаем
          [ "${GITHUB_REF_NAME}" = "main" ] || TAG="${TAG}-test"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/video.mp4 out/audio.wav out/cover.png out/meta.json out/credits.txt out/contact.jpg out/speech.wav out/speech.json \
            --title "Выпуск $TAG" --notes-file out/credits.txt
