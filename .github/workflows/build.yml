name: Build issue
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Папка выпуска, например issues/2026-11-15"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install numpy requests pillow
      - name: Make issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/make_issue.py "${{ inputs.issue }}" out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(basename "${{ inputs.issue }}")"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/video.mp4 out/audio.wav out/cover.png out/meta.json \
            --title "Выпуск $TAG" --notes "Автосборка"
