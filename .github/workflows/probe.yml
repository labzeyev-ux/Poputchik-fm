name: Probe footage sources
on:
  push:
    branches: [claude/eloquent-babbage-ou6ng9]
    paths: [".github/workflows/probe.yml", "scripts/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install requests pillow
      - run: python scripts/probe.py
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release delete probe-frames --yes --cleanup-tag 2>/dev/null || true
          gh release create probe-frames out/*.jpg out/list.txt --title "probe" --notes "временно" --prerelease
